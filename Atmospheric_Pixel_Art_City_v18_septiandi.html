<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmospheric Pixel Art City v18</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030408;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
        }
        
        #canvas-container {
            position: relative;
            width: 100vw;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden; /* keeps the canvas inside the frame while it sways a hair during an earthquake */
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            /* CRITICAL: This gives the canvas a crisp, pixel-art look when upscaled */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="640" height="360"></canvas>
        <div id="ui-overlay">
            <div>Time: <span id="time-text">Pagi</span></div>
            <div>Weather: <span id="weather-text">Clear</span></div>
            <div>Wind: <span id="wind-text">0.0</span> km/h</div>
            <div>Season: <span id="season-text">Hujan</span></div>
            <div>Air: <span id="air-text">30 · Baik</span></div>
            <div>Banjir: <span id="flood-text">Kering</span></div>
            <div style="margin-top:6px;font-size:11px;opacity:.4">[K] Kemarau (tekan lagi = maju) · [H] Hujan · [B] Badai Besar · [G] Gempa · [F] Karhutla · badai → banjir · [P] Pesawat</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const mainCtx = canvas.getContext('2d', { alpha: false, desynchronized: true }); // opaque canvas = cheaper compositing
        let ctx = mainCtx;
        const width = canvas.width;
        const height = canvas.height;

        // Layout of the scene, top to bottom: far city ground line -> suburb plain -> road -> foreground lot
        const ROAD_Y = height - 100, ROAD_H = 36, LANES = 6; // 3 lanes each way
        const HORIZON_Y = height - 126; // ground line of the far city, ~30 km out
        const CITY_K = 0.5;             // apparent size of the skyline vs. the old ~15 km version

        // UI Elements
        const weatherText = document.getElementById('weather-text');
        const windText = document.getElementById('wind-text');
        const timeText = document.getElementById('time-text');
        const seasonText = document.getElementById('season-text'), airText = document.getElementById('air-text');
        const floodTextEl = document.getElementById('flood-text'); let lastFloodTxt = '';
        let lastSeason = '', lastAqi = -1;

        // Global State & Physics
        let time = 0;
        let weatherState = 0; // 0 = Clear, 1 = Rain, 2 = Hurricane/Typhoon
        let weatherTransition = 0; // 0.0 to 1.0 (Overall intensity)
        let targetWeatherTransition = 0;
        let weatherTimer = 400; // frames until the next random weather roll
        
        let windSpeed = 0.3; // Current wind — near-zero at rest so clear weather reads as truly calm
        let targetWindSpeed = 0.3; // Can go up to 25+ during storm
        let lightningFlash = 0;
        let quake = 0, quakeT = -1, quakeDust = 0; // earthquake: quake 0..1 = current shaking strength, quakeT = frames since it began (-1 = none), dust = haze it kicks up
        const QUAKE_DUR = 780; // ~13 s: faint P-wave tremor, sudden strong shaking, then it dies away
        let karhutlaOn = false, karhutla = 0; // forest / land fires (karhutla): thick orange-red smoke haze, AQI climbing toward 1000; needs the dry season
        let bigStormOn = false, bigStorm = 0; // manual big storm (button / [B]); bigStorm 0..1 = how fully it has arrived (drives building sway)
        let boltPoints = null, boltBranch = null; // jagged lightning bolt path
        let powerOn = true; // City-wide power state — flips off when the storm knocks out the grid
        let stormBuildup = 0; // 0..1 — rises only while the sky is actively thickening ahead of rain/a storm
        let pollution = 0; // 0..1 — thickens day by day through the dry season (kemarau), washed away by the first rains
        // Seasons: 0 = musim hujan (random weather), 1 = kemarau (a long dry spell: no rain, smog builds up gradually)
        const DAY_FRAMES = 1 / 0.00003; // one in-game day, in 1/60 s units
        let season = 0, seasonElapsed = 0, seasonLen = 16000, firstRain = false;
        let trafficDensity = 0.6, targetTrafficDensity = 0.6; // fraction of cars actually out on the road, by time of day
        let congestion = 0.3, targetCongestion = 0.3; // 0 = free-flowing traffic, 1 = bumper-to-bumper gridlock
        let jamEvent = 0, jamTimer = 900 + Math.random() * 700, jamDuration = 0; // occasional off-schedule jams that can hit any time of day

        // Day/Night cycle: dayTime 0=midnight -> 0.25=sunrise -> 0.5=noon -> 0.75=sunset -> 1=midnight
        let dayTime = 0.30;
        let sunHeight = 0, dayAmt = 0, nightAmt = 1, duskAmt = 0, darkEnough = true;

        // Who is awake: fraction of homes / offices with lights on, by clock hour (0 = midnight, 6 = sunrise, 18 = sunset).
        // Most windows go dark late at night as people sleep, a few stay lit (night owls, night shifts), and a
        // handful switch on again in the pre-dawn hours (subuh) before sunrise.
        const HOME_AWAKE = [[0, 0.18], [1, 0.10], [2, 0.06], [3.5, 0.04], [4.5, 0.06], [5.2, 0.22], [6, 0.45], [7, 0.5], [17, 1], [21.5, 1], [22.6, 0.72], [24, 0.18]];
        const OFFICE_AWAKE = [[0, 0.25], [1.5, 0.16], [3.5, 0.12], [5, 0.14], [5.8, 0.28], [6.6, 0.4], [17, 1], [21, 1], [22.5, 0.7], [24, 0.25]];
        let awakeHome = 1, awakeOffice = 1;
        const litK = (sl, awake) => { const t = Math.min(1, Math.max(0, (awake - sl) / 0.05)); return t * t * (3 - 2 * t); }; // 0..1: eases a light on/off
        function awakeAt(pts, h) {
            for (let i = 1; i < pts.length; i++) if (h <= pts[i][0]) {
                let t = (h - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]); t = t * t * (3 - 2 * t);
                return pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t;
            }
            return pts[pts.length - 1][1];
        }

        // Arrays for procedural elements
        const stars = [];
        const clouds = [];
        const buildings = [];
        const cars = [];
        const raindrops = [];
        const debris = []; // Flying leaves/trash during storm
        const suburbs = []; // Small suburban houses, nearer than the city skyline
        const suburbTrees = []; // Trees scattered between the houses
        const foregroundHomes = []; // Cozy close-up cottages filling the empty lot in front of the road
        const foregroundTrees = []; // Close-up trees near the road, thickest under the wizard's rooftop hill
        const gatherClouds = []; // Extra clouds that fade in to thicken the sky as a storm approaches
        const broadLeaves = []; // Fixed-shape tropical leaves — only their sway animates, never their size
        const backLights = []; // Scattered distant light points filling empty gaps in the city/suburb void
        const smallHills = []; // Rolling grass hills filling the empty land before the road/city begins
        const driftLeaves = []; // Leaves torn off the canopies, tumbling downwind
        const palms = []; // Foreground palms (each one is a small spring: it leans into gusts and rebounds)
        const lanes = Array.from({ length: LANES }, () => []); // cars grouped by lane
        let allTrees = [], suburbDraw = [], fgDraw = []; // spring-driven trees / depth-sorted draw lists
        let windPhase = 0; // accumulates with wind strength so flutter speeds up smoothly, never jumps
        let hazeRGB = [26, 34, 46]; // horizon sky colour, used to fade the far city into the air

        // Small per-lamp dusk/dawn stagger so the 5 street/garden lamps don't all snap on together
        const lampOnThresh = { 1: 0.05, 2: 0.14, 3: 0.09, 4: 0.2, 5: 0.12, 6: 0.16, 7: 0.07, 8: 0.1, 9: 0.13, 10: 0.08, 11: 0.15 };

        // ---- Frame-rate independence + caches ---------------------------------------------------------
        // dt = frame time in units of 1/60 s (1 @60Hz, 0.5 @120Hz). All motion is scaled by it, so speed is identical
        // on any monitor and every refresh renders a fresh, evenly spaced position.
        let dt = 1, kBrake = 0.08, kAccel = 0.035;
        const lerpK = r => 1 - Math.pow(1 - r, dt); // per-frame easing rate -> frame-rate independent
        let lastPhase = '', lastWeather = '', lastWind = '';
        let winN = 0, winX, winY, winTh, winCol, winLit, winSl, winShownAw = -1, winVersion = 0, winShown = -1, winShownVer = -1, winCanvas = null;
        let carsR = [], carsL = [], skyline = null, layerFar = [], layer0 = [], layer1 = [];

        function makeSprite(size, draw) {
            const c = document.createElement('canvas'); c.width = c.height = size;
            draw(c.getContext('2d'), size); return c;
        }
        // Cloud puffs: the radial gradient is rendered once per darkness level, then just drawImage'd (no per-frame gradients)
        const cloudSprites = new Map();
        function cloudSprite(kind, d) {
            const key = kind * 1000 + d;
            let sp = cloudSprites.get(key);
            if (!sp) {
                if (cloudSprites.size > 400) cloudSprites.clear();
                const o = kind ? [[14, 15, 20], [4, 5, 8], 0.8] : [[18, 20, 26], [6, 7, 10], 0.85];
                sp = makeSprite(96, (g, S) => {
                    const r = S / 2, gr = g.createRadialGradient(r, r - r * 0.3, r * 0.1, r, r, r);
                    gr.addColorStop(0, `rgba(${d + o[0][0]}, ${d + o[0][1]}, ${d + o[0][2]}, 1)`);
                    gr.addColorStop(0.6, `rgba(${d + o[1][0]}, ${d + o[1][1]}, ${d + o[1][2]}, ${o[2]})`);
                    gr.addColorStop(1, `rgba(${d}, ${d}, ${d + 4}, 0)`);
                    g.fillStyle = gr; g.beginPath(); g.arc(r, r, r, 0, 6.2832); g.fill();
                });
                cloudSprites.set(key, sp);
            }
            return sp;
        }
        // Soft light glows (lamps, lanterns, staff orb): one cached sprite per colour, scaled + faded per draw
        const glowCache = {};
        function drawGlow(x, y, r, a, rgb, sy = 1) {
            const sp = glowCache[rgb] || (glowCache[rgb] = makeSprite(64, (g, S) => {
                const h = S / 2, gr = g.createRadialGradient(h, h, h * 0.06, h, h, h);
                gr.addColorStop(0, `rgba(${rgb}, 1)`); gr.addColorStop(1, `rgba(${rgb}, 0)`);
                g.fillStyle = gr; g.fillRect(0, 0, S, S);
            }));
            ctx.globalAlpha = a; ctx.drawImage(sp, x - r, y - r * sy, r * 2, r * 2 * sy); ctx.globalAlpha = 1;
        }
        function prepareStatic() {
            carsR = cars.filter(c => c.color === '#fff'); carsL = cars.filter(c => c.color !== '#fff');
            layerFar = buildings.filter(b => b.layer === -1);
            layer0 = buildings.filter(b => b.layer === 0);
            layer1 = buildings.filter(b => b.layer === 1);
            // flatten every skyline window into typed arrays (fast scans, no per-window objects at runtime)
            suburbs.forEach(h => h.sl = Math.random()); foregroundHomes.forEach(h => h.sl = Math.random()); backLights.forEach(l => l.sl = Math.random());
            const base = HORIZON_Y + 2, X = [], Y = [], T = [], C = [], L = [], SL = [];
            layer1.forEach(b => {
                const bodyY = base - (b.bodyHeight !== undefined ? b.bodyHeight : b.height), rows = {};
                // sleep value = mostly per-window luck blended with per-floor luck, so whole floors go dark together (uniform overall)
                b.windows.forEach(w => { const r = Math.round(w.y / 3); if (rows[r] === undefined) rows[r] = Math.random(); const u = (Math.random() + rows[r]) / 2; SL.push(u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u)); });
                b.windows.forEach(w => { X.push(Math.round(b.x + w.x)); Y.push(Math.round(bodyY + w.y)); T.push(w.onThresh); C.push(w.type === '#f5e39d' ? 0 : 1); L.push(w.lit ? 1 : 0); });
            });
            winN = X.length; winX = Float32Array.from(X); winY = Float32Array.from(Y);
            winTh = Float32Array.from(T); winCol = Uint8Array.from(C); winLit = Uint8Array.from(L); winSl = Float32Array.from(SL);
        }

        // ---- Wind, trees and drifting leaves ---------------------------------------------------------
        // Local wind at x: gusts sweep left -> right across the scene as slow swells plus quicker puffs,
        // so neighbouring trees lean one after another instead of all swaying in unison.
        function windAt(x) {
            const swell = Math.sin(time * 0.012 - x * 0.006) * 0.28 + Math.sin(time * 0.031 - x * 0.017 + 2.1) * 0.2;
            const puff = Math.sin(time * 0.083 - x * 0.04 + 0.7) * 0.1;
            return windSpeed * Math.max(0.15, 1 + swell + puff);
        }

        function makeTree(x, size, by, trunk) {
            // Canopy = overlapping puffs with a fixed shape; only their offsets animate
            // (tiny far-off trees get only three puffs: at that size the other two can't be told apart)
            const puffs = [
                { dx: 0, dy: -0.05, r: 0.5 }, { dx: -0.42, dy: 0.16, r: 0.36 }, { dx: 0.42, dy: 0.14, r: 0.36 },
                { dx: -0.16, dy: -0.4, r: 0.32 }, { dx: 0.2, dy: -0.36, r: 0.3 }
            ].slice(0, size < 5 ? 3 : 5).map(p => ({
                dx: p.dx + (Math.random() - 0.5) * 0.12, dy: p.dy + (Math.random() - 0.5) * 0.1,
                r: p.r * (0.9 + Math.random() * 0.2), ph: Math.random() * 6.283, a: Math.random() * 6.283
            }));
            return { x, size, by, trunk, puffs, lean: 0, vel: 0, w: 0, ph: Math.random() * 6.283,
                     k: 0.008 + Math.random() * 0.008, flex: 0.8 + Math.random() * 0.4 };
        }


        // ---- Mixed forest: several tree species, each tinted by the time of day and rim-lit on the sun side ----
        const KINDS = {
            oak:     { d: [22, 58, 30], trunk: 1.5, w: 26 }, blossom: { d: [26, 62, 34], trunk: 1.4, w: 12 },
            pine:    { d: [10, 40, 32], trunk: 1.6, w: 20 }, cypress: { d: [16, 48, 28], trunk: 1.9, w: 12 },
            banyan:  { d: [14, 42, 24], trunk: 1.0, w: 8 },  palm:    { d: [24, 62, 34], trunk: 1.6, w: 12 },
            bush:    { d: [30, 68, 36], trunk: 0.3, w: 10 }
        };
        const KIND_KEYS = Object.keys(KINDS), KIND_W = KIND_KEYS.reduce((a, k) => a + KINDS[k].w, 0);
        function pickKind(allow) {
            const keys = allow || KIND_KEYS; let tot = 0; keys.forEach(k => tot += KINDS[k].w);
            let r = Math.random() * tot; for (const k of keys) { r -= KINDS[k].w; if (r <= 0) return k; } return keys[0];
        }
        function makeForestTree(x, size, by, kind) {
            const t = makeTree(x, size, by, KINDS[kind].trunk);
            t.kind = kind; t.tone = (Math.random() - 0.5) * 14; t.dir = Math.random() < 0.5 ? -1 : 1;
            if (kind === 'blossom') { // flowering tree: pink / yellow / red blooms scattered over the crown
                t.bloomCol = [[240, 120, 160], [250, 205, 70], [225, 70, 55]][Math.floor(Math.random() * 3)];
                t.blooms = Array.from({ length: 8 }, () => ({ i: Math.floor(Math.random() * t.puffs.length), a: Math.random() * 6.283, rr: 0.2 + Math.random() * 0.7 }));
            }
            return t;
        }
        function drawKindTree(t) {
            const s = t.size, K = KINDS[t.kind], fl = Math.min(1, t.w * 0.04), lean = t.lean, kind = t.kind;
            const b = FT.b, wm = FT.warm, tone = t.tone;
            const r = Math.min(255, 3 + (K.d[0] + tone * 0.4 - 3) * b + wm * 16);
            const g = Math.min(255, 5 + (K.d[1] + tone - 5) * b + wm * 5);
            const bl = Math.min(255, 8 + (K.d[2] + tone * 0.5 - 8) * b - wm * 4);
            const dark = `rgb(${r | 0}, ${g | 0}, ${bl | 0})`, trunkC = `rgb(${(r * 0.55) | 0}, ${(g * 0.45) | 0}, ${(bl * 0.5) | 0})`;
            const rim = FT.rim > 0.04 && s >= 5 ? FT.rim : 0;
            const litC = `rgb(${Math.min(255, r + (r * 1.8 + SUN.col[0] * 0.1 - r) * rim) | 0}, ${Math.min(255, g + (g * 1.9 + SUN.col[1] * 0.1 - g) * rim) | 0}, ${Math.min(255, bl + (bl * 1.5 + SUN.col[2] * 0.04 - bl) * rim) | 0})`;
            const sd = SUN.x > t.x ? 1 : -1, ox = sd * Math.max(0.6, s * 0.07), oy = -Math.max(0.5, s * 0.05);
            const P = new Path2D(); let pk = null;

            ctx.lineCap = 'butt';
            if (kind === 'palm') {
                const tx = t.x + lean * s * 1.1 + t.dir * s * 0.12, ty = t.by - s * 1.7;
                ctx.strokeStyle = trunkC; ctx.lineWidth = Math.max(1, s * 0.12);
                ctx.beginPath(); ctx.moveTo(t.x, t.by);
                ctx.quadraticCurveTo(t.x + lean * s * 0.15 + t.dir * s * 0.25, t.by - s * 0.9, tx, ty); ctx.stroke();
                const N = 9, L = s * 0.75;
                for (let i = 0; i < N; i++) {
                    const a = -Math.PI + i * (Math.PI / (N - 1)), c = Math.cos(a), sn = Math.sin(a);
                    const ex = tx + c * L + lean * s * 0.5 + Math.sin(t.ph + i * 1.3) * fl * s * 0.09, ey = ty + sn * L * 0.5 + L * (0.4 - Math.abs(sn) * 0.12);
                    P.moveTo(tx, ty); P.quadraticCurveTo(tx + c * L * 0.55, ty + sn * L * 0.9, ex, ey);
                }
                ctx.lineWidth = Math.max(1, s * 0.1);
                if (rim > 0) { ctx.save(); ctx.translate(ox, oy); ctx.strokeStyle = litC; ctx.stroke(P); ctx.restore(); }
                ctx.strokeStyle = dark; ctx.stroke(P);
                return;
            }
            if (kind === 'pine') {
                const tiers = s < 7 ? 3 : 4;
                ctx.strokeStyle = trunkC; ctx.lineWidth = Math.max(1, s * 0.12);
                ctx.beginPath(); ctx.moveTo(t.x, t.by); ctx.lineTo(t.x + lean * s * 0.05, t.by - s * 0.5); ctx.stroke();
                for (let i = 0; i < tiers; i++) {
                    const by2 = t.by - s * 0.35 - i * s * (tiers === 3 ? 0.55 : 0.4), hw = s * 0.62 * (1 - i * 0.2), h = s * 0.72;
                    const cx = t.x + lean * s * (0.08 + i * 0.26) + Math.sin(t.ph + i) * fl * s * 0.04;
                    P.moveTo(cx - hw, by2); P.lineTo(cx + hw, by2); P.lineTo(cx + lean * s * 0.05, by2 - h); P.closePath();
                }
            } else if (kind === 'cypress') {
                ctx.strokeStyle = trunkC; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(t.x, t.by); ctx.lineTo(t.x + lean * s * 0.1, t.by - s * 0.3); ctx.stroke();
                P.ellipse(t.x + lean * s * 0.5, t.by - s * 0.95, s * 0.2 + s * 0.02 * Math.sin(t.ph) * fl, s * 0.95, lean * 0.6, 0, 6.2832);
            } else { // oak, blossom, banyan, bush: overlapping crown puffs, shaped per species
                const wide = kind === 'banyan', low = kind === 'bush';
                const sx = wide ? 1.45 : low ? 1.1 : 1, sy = wide ? 0.6 : low ? 0.7 : 1, rs = wide ? 0.95 : low ? 0.75 : 1;
                const cy = t.by - s * (low ? 0.3 : wide ? 1.05 : t.trunk), cx = t.x + lean * s * (low ? 0.3 : 1);
                if (!low) {
                    ctx.strokeStyle = trunkC; ctx.lineWidth = wide ? Math.max(1.5, s * 0.22) : Math.max(1, s * 0.13);
                    ctx.beginPath(); ctx.moveTo(t.x, t.by); ctx.quadraticCurveTo(t.x + lean * s * 0.12, t.by - s * (wide ? 1.05 : t.trunk) * 0.55, cx, cy); ctx.stroke();
                    if (wide) { // hanging aerial roots
                        ctx.lineWidth = 1; ctx.beginPath();
                        for (let k = -1; k <= 1; k++) { ctx.moveTo(cx + k * s * 0.42, cy + s * 0.12); ctx.lineTo(t.x + k * s * 0.42 + lean * s * 0.1, t.by); }
                        ctx.stroke();
                    }
                }
                pk = [];
                for (let i = 0; i < t.puffs.length; i++) {
                    const p = t.puffs[i];
                    const px = cx + (p.dx * sx + Math.sin(t.ph + p.ph) * fl * 0.16) * s, py = cy + (p.dy * sy + Math.cos(t.ph * 1.3 + p.ph) * fl * 0.08) * s, rr = p.r * s * rs;
                    pk.push([px, py, rr]);
                    P.moveTo(px + rr * (wide ? 1.15 : 1), py); P.ellipse(px, py, rr * (wide ? 1.15 : 1), rr * (wide ? 0.8 : low ? 0.85 : 1), 0, 0, 6.2832);
                    const tr = rr * (1.02 + fl * 0.3 * (0.5 + 0.5 * Math.sin(t.ph * 2.3 + p.ph * 2)));
                    P.rect(px + Math.cos(p.a) * tr - 0.5, py + Math.sin(p.a) * tr - 0.5, 1, 1);
                }
            }
            if (rim > 0) { ctx.save(); ctx.translate(ox, oy); ctx.fillStyle = litC; ctx.fill(P); ctx.restore(); }
            ctx.fillStyle = dark; ctx.fill(P);
            if (pk && t.blooms && b > 0.12) { // blossoms
                ctx.fillStyle = `rgba(${t.bloomCol}, ${b * 0.95})`;
                for (const bm of t.blooms) { const q = pk[bm.i]; ctx.fillRect(q[0] + Math.cos(bm.a) * bm.rr * q[2], q[1] + Math.sin(bm.a) * bm.rr * q[2], 1.3, 1.3); }
            }
        }

        // The empty land beside the road becomes a mixed forest: a leafy belt on the near verge, extra trees
        // tucked between the cottages, and a boulevard line of trees along the far edge of the road.
        function initRoadsideForest() {
            const roadBottom = ROAD_Y + ROAD_H, hillX = width - 170;
            for (let pass = 0; pass < 2; pass++) { // near verge: dense belt right beside the road
                for (let x = -14 + Math.random() * 6; x < hillX; x += 4 + Math.random() * 6) {
                    const k = pickKind(['oak', 'blossom', 'pine', 'cypress', 'banyan', 'palm', 'bush', 'bush']);
                    foregroundTrees.push(makeForestTree(x, 4.6 + Math.random() * 3.4, roadBottom + 12 + Math.random() * 14, k));
                }
            }
            for (let i = 0; i < 55; i++) { // trees and shrubs filling the gaps between the cottages
                const k = pickKind(['bush', 'blossom', 'cypress', 'palm', 'oak', 'bush']);
                foregroundTrees.push(makeForestTree(Math.random() * hillX, 5 + Math.random() * 4, roadBottom + 26 + Math.random() * 34, k));
            }
            for (let x = -8 + Math.random() * 8; x < width + 8; x += 8 + Math.random() * 12) { // far edge of the road
                if (Math.random() < 0.2) continue;
                suburbTrees.push(makeForestTree(x, 5 + Math.random() * 5.5, ROAD_Y - 0.5 - Math.random() * 1.6, pickKind(['oak', 'pine', 'cypress', 'blossom', 'palm', 'oak'])));
            }
            suburbDraw = suburbs.concat(suburbTrees).sort((a, b) => a.by - b.by);
            fgDraw = foregroundHomes.concat(foregroundTrees).sort((a, b) => a.by - b.by);
        }

        function drawTree(t) {
            if (t.kind) return drawKindTree(t);
            const s = t.size, cy = t.by - s * t.trunk;
            const cx = t.x + t.lean * s;                // whole crown leans downwind (spring-driven, overshoots a little)
            const fl = Math.min(1, t.w * 0.04);         // 0 = still air ... 1 = leaves thrashing

            ctx.strokeStyle = '#020203';
            ctx.lineWidth = Math.max(1, s * 0.13);
            ctx.beginPath();
            ctx.moveTo(t.x, t.by);
            ctx.quadraticCurveTo(t.x + t.lean * s * 0.12, t.by - s * t.trunk * 0.55, cx, cy); // trunk flexes like a bow
            ctx.stroke();

            ctx.fillStyle = '#020203';
            ctx.beginPath();
            let gx = cx, gy = cy, gr = s * 0.3;
            for (let i = 0; i < t.puffs.length; i++) {
                const p = t.puffs[i];
                // each puff swings on its own phase, so the canopy ripples instead of moving as one blob
                const px = cx + (p.dx + Math.sin(t.ph + p.ph) * fl * 0.16) * s;
                const py = cy + (p.dy + Math.cos(t.ph * 1.3 + p.ph) * fl * 0.08) * s;
                const r = p.r * s;
                ctx.moveTo(px + r, py);
                ctx.arc(px, py, r, 0, 6.2832);
                // ragged leaf tip: pokes out past the canopy edge as the wind picks up
                const tr = r * (1.02 + fl * 0.3 * (0.5 + 0.5 * Math.sin(t.ph * 2.3 + p.ph * 2)));
                ctx.rect(px + Math.cos(p.a) * tr - 0.5, py + Math.sin(p.a) * tr - 0.5, 1, 1);
                if (i === 3) { gx = px; gy = py; gr = r; }
            }
            ctx.fill();

            if (s > 5 && dayAmt > 0.15 && weatherTransition < 0.7) { // sunlit green rim along the top of the canopy
                ctx.strokeStyle = `rgba(80, 125, 88, ${dayAmt * 0.3 * (1 - weatherTransition)})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(gx, gy, gr * 0.95, Math.PI * 1.05, Math.PI * 1.75);
                ctx.stroke();
            }
        }

        function updateDriftLeaves() {
            // leaves tear off a canopy more often the harder it blows
            if (driftLeaves.length < 140 && allTrees.length && Math.random() < (0.003 + Math.min(windSpeed, 30) * 0.005) * dt) {
                const t = allTrees[Math.floor(Math.random() * allTrees.length)], s = t.size;
                driftLeaves.push({
                    x: t.x + t.lean * s + (Math.random() - 0.5) * s, y: t.by - s * t.trunk + (Math.random() - 0.5) * s * 0.6,
                    gy: t.by, vx: 0, vy: 0, rot: Math.random() * 6.283, ph: Math.random() * 6.283,
                    size: 1.1 + s * 0.09, fade: 1, landed: false
                });
            }
            for (let i = driftLeaves.length - 1; i >= 0; i--) {
                const l = driftLeaves[i], w = windAt(l.x);
                l.ph += (0.12 + Math.min(w, 30) * 0.012) * dt;
                l.vx += (w * 0.26 - l.vx) * lerpK(0.06) + Math.sin(l.ph) * 0.05 * dt; // carried downwind, tumbling side to side
                if (!l.landed) {
                    // flutter-fall: a slow zig-zag drop; a strong gust can hold the leaf aloft
                    l.vy += (0.22 + Math.abs(Math.sin(l.ph * 0.7)) * 0.2 - Math.min(0.5, w * 0.012) - l.vy) * lerpK(0.08);
                    l.y += l.vy * dt;
                    if (l.y >= l.gy) { l.y = l.gy; l.landed = true; }
                } else {
                    l.vx *= Math.pow(0.9, dt);
                    l.fade -= 0.03 * dt;
                }
                l.x += l.vx * dt;
                l.rot += (Math.sin(l.ph) * 0.15 + l.vx * 0.03) * dt;
                if (l.fade <= 0 || l.x > width + 10 || l.y < -20) driftLeaves.splice(i, 1);
            }
        }

        function drawDriftLeaves() {
            ctx.fillStyle = dayAmt > 0.1 ? 'rgb(14, 30, 18)' : 'rgb(34, 42, 50)';
            driftLeaves.forEach(l => {
                ctx.globalAlpha = Math.max(0, l.fade);
                ctx.beginPath();
                // |cos| squashes the leaf as it flips over, so it reads as tumbling rather than spinning flat
                ctx.ellipse(l.x, l.y, l.size, l.size * (0.2 + 0.4 * Math.abs(Math.cos(l.ph * 0.9))), l.rot, 0, 6.2832);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function drawHouse(h) {
            const hy = h.by - h.height;
            ctx.fillStyle = h.color;
            ctx.fillRect(h.x, hy, h.width, h.height);
            ctx.fillStyle = h.roofColor;
            ctx.beginPath();
            ctx.moveTo(h.x - 1, hy);
            ctx.lineTo(h.x + h.width / 2, hy - h.roofH);
            ctx.lineTo(h.x + h.width + 1, hy);
            ctx.fill();
            const hk = (h.lit && powerOn && nightAmt > h.onThresh) ? litK(h.sl, awakeHome) : 0;
            if (hk > 0.01) {
                const s = Math.max(1, Math.round(2 * h.sc)), wx = Math.round(h.x + h.width * 0.35), wy = Math.round(hy + h.height * 0.45);
                ctx.fillStyle = `rgba(255, 190, 110, ${0.2 * hk})`;
                ctx.fillRect(wx - 1, wy - 1, s + 2, s + 2);
                ctx.fillStyle = `rgba(255, 200, 130, ${0.9 * hk})`;
                ctx.fillRect(wx, wy, s, s);
            }
            if (flood > 0.45) wetFoot(h.x, h.width, h.by, (1 + 3 * ss(0.45, 1, flood)) * h.sc);
        }

        // Car-following model, run separately in every lane. Each lane is a closed ring that is wider than the screen
        // (CAR_M px of road hidden past each edge), so cars are born and die completely out of sight and arrive already
        // spaced and up to speed: nothing bunches up at the screen edge. The leader of a car is the next active car in ring
        // order (wrapping around), and the gap is measured around the ring, so following stays correct across the wrap.
        // A car's on/off-road state is re-rolled only while it is hidden, so nothing pops in or out mid-road.
        const CAR_M = 48, CAR_LOOP = width + CAR_M * 2;
        function advanceLane(lane, dir) {
            const n = lane.length;
            for (let i = n - 1; i >= 0; i--) {
                const c = lane[i];
                let desiredSpeed = c.baseSpeed * (1 - congestion * 0.15);
                if (c.active) {
                    let ahead = null;
                    for (let j = 1; j < n; j++) { const o = lane[(i + j) % n]; if (o.active) { ahead = o; break; } }
                    if (ahead) {
                        let gap = dir > 0 ? (ahead.x - c.x) : (c.x - ahead.x);
                        if (gap < 0) gap += CAR_LOOP;
                        if (gap < 7) desiredSpeed = c.baseSpeed * 0.04;        // nose to tail, barely creeping
                        else if (gap < 14) desiredSpeed = c.baseSpeed * 0.22;  // tight, braking hard
                        else if (gap < 24) desiredSpeed = c.baseSpeed * 0.55;  // closing in, easing off
                        else if (gap < 38) desiredSpeed = c.baseSpeed * 0.85;  // comfortable following gap
                    }
                }
                desiredSpeed *= (1 - quake * 0.85) * (1 - karhutla * 0.2); // brakes when the ground shakes, and eases off in thick smoke
                desiredSpeed *= 1 - ss(0.28, 0.75, flood) * 0.5;   // wades slowly through standing water
                c.stall = c.active && flood > 0.7 && c.stallK < (flood - 0.7) * 2.4; // in deep water some engines drown and the car is stuck
                if (c.stall) desiredSpeed = 0;
                // quicker to brake than to speed back up, like a real driver
                c.speed += (desiredSpeed - c.speed) * (desiredSpeed < c.speed ? kBrake : kAccel);
                c.x += c.speed * dt;
                // wrap by exactly one loop length: spacing is preserved, and it happens far outside the visible area
                if (c.x > width + CAR_M && dir > 0) { c.x -= CAR_LOOP; c.active = Math.random() < trafficDensity; }
                else if (c.x < -CAR_M && dir < 0) { c.x += CAR_LOOP; c.active = Math.random() < trafficDensity; }
            }
        }

        function initStars() {
            for(let i = 0; i < 100; i++) {
                stars.push({ x: Math.random() * width, y: Math.random() * (height / 2), brightness: Math.random(), speed: Math.random() * 0.02 });
            }
        }

        function initClouds() {
            for(let i = 0; i < 22; i++) {
                clouds.push({
                    x: Math.random() * width, y: Math.random() * 90 + 10,
                    size: Math.random() * 26 + 16, speed: Math.random() * 0.08 + 0.03,
                    opacity: Math.random() * 0.25 + 0.1,
                    puffs: Array.from({length: 4}, () => ({
                        dx: (Math.random() - 0.5) * 1.6,
                        dy: (Math.random() - 0.5) * 0.6,
                        s: Math.random() * 0.5 + 0.6
                    }))
                });
            }
        }

        function initGatherClouds() {
            // A second, larger pool of soft cloud blobs — invisible on a clear day, fading in to
            // fill the sky with extra cover as a storm gathers, instead of the old cumulonimbus towers.
            for(let i = 0; i < 26; i++) {
                gatherClouds.push({
                    x: Math.random() * width, y: Math.random() * 70 + 5,
                    size: Math.random() * 30 + 20, speed: Math.random() * 0.06 + 0.02,
                    opacity: Math.random() * 0.3 + 0.2,
                    puffs: Array.from({length: 5}, () => ({
                        dx: (Math.random() - 0.5) * 1.8,
                        dy: (Math.random() - 0.5) * 0.7,
                        s: Math.random() * 0.55 + 0.6
                    }))
                });
            }
        }

        function capInsetAt(shapeType, t) {
            // Returns {leftFrac, rightFrac} — the horizontal bounds (0..1 of building width) that
            // are actually part of the silhouette at progress t through the cap (0 = body edge where
            // the cap starts, 1 = the very tip). Used to keep cap windows correctly inside the shape.
            if (shapeType === 'pencil') {
                let inset = t * 0.46;
                return { leftFrac: inset, rightFrac: 1 - inset };
            }
            if (shapeType === 'oval') {
                let half = 0.5 * Math.sqrt(Math.max(0, 1 - t * t));
                return { leftFrac: 0.5 - half, rightFrac: 0.5 + half };
            }
            if (shapeType === 'diagonal') {
                let rightFrac = Math.min(1, (1 - t) / 0.85);
                return { leftFrac: 0, rightFrac };
            }
            if (shapeType === 'stepped') {
                let tiers = 3;
                let tierIdx = Math.min(tiers - 1, Math.floor(t * tiers));
                let shrink = (tierIdx + 1) / (tiers + 1);
                let insetFrac = (shrink * 0.55) / 2;
                return { leftFrac: insetFrac, rightFrac: 1 - insetFrac };
            }
            return { leftFrac: 0, rightFrac: 1 };
        }

        function initCity() {
            // The skyline now sits ~30 km out, twice as far as before: every building is drawn at CITY_K of its
            // old apparent size, so it takes more (and narrower) buildings to keep the horizon packed.
            // Layer -1: the farthest ridge, barely more than a stipple on the horizon
            for(let i = 0; i < 120; i++) {
                buildings.push({ x: i * (width / 105) - 15 + Math.random() * 3, width: (Math.random() * 10 + 6) * CITY_K, height: (Math.random() * 22 + 10) * CITY_K, layer: -1 });
            }
            // Layer 0: background city — packed low/mid blocks with a few taller towers poking up unevenly
            for(let i = 0; i < 100; i++) {
                let h, pointed = false;
                if (Math.random() < 0.16) { h = 55 + Math.random() * 45; pointed = Math.random() < 0.4; }
                else h = Math.random() * 28 + 16;
                buildings.push({ x: i * (width / 88) - 20 + Math.random() * 5, width: (Math.random() * 16 + 13) * CITY_K, height: h * CITY_K, color: '#0d1119', layer: 0, roof: Math.random(), pointed });
            }
            // Layer 1: the main skyline — scattered supertall towers, mid-rise office blocks and squat low-rises
            const WIN_X = 2.4, WIN_Y = 3; // window pitch: single-pixel lights, as they'd read from 30 km away
            for(let i = 0; i < 64; i++) {
                let roll = Math.random();
                let h;
                if (roll < 0.14) h = 100 + Math.random() * 78;       // supertall towers
                else if (roll < 0.55) h = 48 + Math.random() * 36;   // mid-rise
                else h = 20 + Math.random() * 26;                    // low-rise

                // A rare solitary landmark tower, noticeably taller than everything around it
                let isLandmark = Math.random() < 0.025;
                if (isLandmark) h = 205 + Math.random() * 35;
                h *= CITY_K;

                // The tallest towers get a distinctive, fully solid crown (pencil spire, diagonal cut, setback
                // tiers or a rounded lonjong top) instead of a plain flat roof. No shape leaves a hole in the silhouette.
                let shapeType = 'plain';
                if (isLandmark) {
                    shapeType = Math.random() < 0.5 ? 'pencil' : 'stepped';
                } else if (h > 95 * CITY_K) {
                    let shapeRoll = Math.random();
                    if (shapeRoll < 0.26) shapeType = 'pencil';
                    else if (shapeRoll < 0.48) shapeType = 'diagonal';
                    else if (shapeRoll < 0.70) shapeType = 'stepped';
                    else if (shapeRoll < 0.90) shapeType = 'oval';
                }
                let capFrac = shapeType === 'plain' ? 0 : (shapeType === 'oval' ? (0.3 + Math.random() * 0.18) : (0.22 + Math.random() * 0.14));
                let bodyHeight = h * (1 - capFrac);

                let b = { x: i * (width / 56) - 10, width: (Math.random() * 24 + 17) * CITY_K, height: h, bodyHeight, shapeType, color: '#131826', layer: 1, windows: [], roof: Math.random(), ledges: Math.random() > 0.5 };

                let cols = Math.floor(b.width / WIN_X), rows = Math.floor(bodyHeight / WIN_Y);
                for(let r = 0; r < rows; r++) {
                    for(let c = 0; c < cols; c++) {
                        if(Math.random() > 0.55) b.windows.push({
                            x: c * WIN_X + 1, y: r * WIN_Y + 1.5,
                            lit: Math.random() > 0.35, type: Math.random() > 0.5 ? '#f5e39d' : '#88c9d4',
                            onThresh: 0.03 + Math.random() * 0.32 // staggers exactly when this window lights up at dusk
                        });
                    }
                }

                // Same lit-window treatment up into the cap/spire, so the whole tower glows to its very tip
                if (shapeType !== 'plain') {
                    let capH = h - bodyHeight;
                    let capRows = Math.max(1, Math.floor(capH / WIN_Y));
                    for (let r = 0; r < capRows; r++) {
                        let t = (r + 0.5) / capRows; // 0 = body edge, 1 = tip
                        let bounds = capInsetAt(shapeType, t);
                        let rowWidthPx = (bounds.rightFrac - bounds.leftFrac) * b.width;
                        let cols2 = Math.max(1, Math.floor(rowWidthPx / WIN_X));
                        for (let c = 0; c < cols2; c++) {
                            if (Math.random() > 0.5) {
                                let frac = cols2 > 1 ? (c + 0.5) / cols2 : 0.5;
                                let xFrac = bounds.leftFrac + frac * (bounds.rightFrac - bounds.leftFrac);
                                b.windows.push({
                                    x: xFrac * b.width, y: -((r + 0.5) * (capH / capRows)),
                                    lit: Math.random() > 0.3, type: Math.random() > 0.5 ? '#f5e39d' : '#88c9d4',
                                    onThresh: 0.03 + Math.random() * 0.32
                                });
                            }
                        }
                    }
                }

                buildings.push(b);
            }
        }

        function initBackLights() {
            // Small scattered points of light filling the void between the suburbs and the skyline,
            // standing in for distant windows/lampposts too far away to render individually.
            for(let i = 0; i < 130; i++) {
                backLights.push({
                    x: Math.random() * width, y: HORIZON_Y + 2 + Math.random() * 24,
                    onThresh: 0.03 + Math.random() * 0.32,
                    lit: Math.random() > 0.4,
                    warm: Math.random() > 0.4,
                    seed: Math.random() * 10
                });
            }
        }

        function initBroadLeaves() {
            // Fixed shapes for the tropical undergrowth — generated once so only wind sway animates
            // them; regenerating their size every frame was making them look restless even in calm air.
            // Thick clusters anchor the base of each palm tree, plus a scattered ground-cover layer
            // along the whole bottom edge so no strip of bare land is left showing between them.
            let palmBases = [40, -10, width - 50, width + 20];
            palmBases.forEach(px => {
                for (let i = 0; i < 7; i++) {
                    broadLeaves.push({ x: px + (Math.random() - 0.5) * 26, scale: 1.3 + Math.random() * 1.4, angle: (Math.random() - 0.5) * 1.2, seed: Math.random() * 10 });
                }
            });
            // General ground-cover foliage scattered along the entire bottom edge
            let x = -10;
            while (x < width + 10) {
                broadLeaves.push({ x, scale: 1.0 + Math.random() * 1.1, angle: (Math.random() - 0.5) * 1.2, seed: Math.random() * 10 });
                x += Math.random() * 5 + 4;
            }
        }

        function initSuburbs() {
            // A dense field of houses scattered over the plain between the far city and the road. It's built from
            // ROWS rows at different depths (far = smaller and hazier), each jittered on its own, so plots land
            // anywhere instead of lining up along one street. Most gaps get a tree clump and extra trees are
            // dropped at random on top, so no bare ground shows.
            const ROWS = 10;
            const rowY = r => ROAD_Y - r * 2.6 - Math.random() * 1.6;
            for (let r = 0; r < ROWS; r++) {
                const far = r / (ROWS - 1), sc = 1 - far * 0.45;
                let x = -12 + Math.random() * 8;
                while (x < width + 10) {
                    const dense = x > width * 0.6 ? 0.45 : 1; // the neighbourhood under the wizard's hill is packed tighter
                    const w = (Math.random() * 8 + 7) * sc;
                    if (Math.random() > 0.08) {
                        const shade = Math.floor(Math.random() * 8);
                        suburbs.push({
                            x, width: w, height: (Math.random() * 11 + 12) * sc * (Math.random() < 0.2 ? 1.5 : 1),
                            roofH: (Math.random() * 4 + 3) * sc, by: rowY(r), sc,
                            color: `rgb(${18 + shade + far * 8}, ${14 + shade * 0.7 + far * 12}, ${16 + shade * 0.8 + far * 16})`,
                            roofColor: `rgb(${10 + far * 8}, ${12 + far * 10}, ${16 + far * 14})`,
                            lit: Math.random() > 0.4, onThresh: 0.03 + Math.random() * 0.32
                        });
                    }
                    x += w + (Math.random() * 2.4 + 0.3) * sc * dense;
                    if (Math.random() < 0.5) {
                        const clump = 1 + Math.floor(Math.random() * 2);
                        for (let k = 0; k < clump; k++) suburbTrees.push(makeTree(x + k * (Math.random() * 2 + 1.5) * sc, (Math.random() * 4 + 4.5) * sc, rowY(r), 1.3));
                        x += clump * (Math.random() * 2 + 1.5) * sc * dense;
                    }
                }
            }
            for (let i = 0; i < 60; i++) { // extra trees at random depths and positions
                const r = Math.floor(Math.random() * ROWS), sc = 1 - (r / (ROWS - 1)) * 0.45;
                suburbTrees.push(makeTree(Math.random() * width, (Math.random() * 4 + 4.5) * sc, rowY(r), 1.3));
            }
            suburbDraw = suburbs.concat(suburbTrees).sort((a, b) => a.by - b.by); // far first, so nearer plots overlap
        }

        function initForegroundHomes() {
            // Cottages scattered across the whole lot in front of the road, in four depth bands: higher up =
            // further away = smaller. They stop short of the wizard's rooftop hill on the right.
            const endX = width - 185;
            for (let r = 0; r < 4; r++) {
                const sc = 0.66 + r * 0.113, lift = r * 2.3;
                let x = -8 + Math.random() * 10;
                while (x < endX) {
                    const w = (16 + Math.random() * 9) * sc, warmth = Math.random();
                    if (Math.random() > 0.12) {
                        foregroundHomes.push({
                            x, width: w, height: (15 + Math.random() * 7) * sc, roofH: (8 + Math.random() * 4) * sc,
                            by: height - (3 - r) * 12 - Math.random() * 3, sc,
                            wallColor: `rgb(${12 + lift + warmth * 6}, ${10 + lift * 0.75 + warmth * 4}, ${12 + lift * 0.9 + warmth * 5})`,
                            roofColor: warmth > 0.5 ? (r > 1 ? '#2a1519' : '#1c0d10') : (r > 1 ? '#141a23' : '#0e131b'),
                            lit: Math.random() > 0.3,
                            hasFence: r >= 2 && Math.random() > 0.4,
                            hasLantern: r >= 2 && Math.random() > 0.45,
                            seed: Math.random() * 10, onThresh: 0.03 + Math.random() * 0.32
                        });
                    }
                    x += w + (Math.random() * 3 + 1) * sc;
                }
            }
        }

        function initForegroundTrees() {
            // Close-camera trees hugging the road, thickest in the strip below the wizard's rooftop hill and over
            // the left-hand hills. Each is planted at a random depth (0 = bottom edge, 1 = furthest up the lot).
            const plant = (x, size) => {
                const d = Math.random();
                foregroundTrees.push(makeForestTree(x, size * (1 - d * 0.34), height - d * 36, pickKind()));
            };
            for (let pass = 0; pass < 2; pass++) {
                for (let x = width * 0.58 + Math.random() * 5; x < width - 165; x += Math.random() * 7 + 4) plant(x, Math.random() * 6 + 7);
                for (let x = -20 + Math.random() * 5; x < 108; x += Math.random() * 8 + 4) plant(x, Math.random() * 5.5 + 6.5);
            }
            for (let i = 0; i < 20; i++) plant(Math.random() * width * 0.58, Math.random() * 5 + 6);
            fgDraw = foregroundHomes.concat(foregroundTrees).sort((a, b) => a.by - b.by); // far first
        }

        function initSmallHills() {
            // A few soft rolling hills filling the empty land before the road and the foreground
            // neighborhood begin, so that stretch reads as gentle countryside rather than bare ground.
            let spots = [-20, 15, 50, 85];
            spots.forEach((x, idx) => {
                smallHills.push({
                    x, width: 40 + Math.random() * 28, height: 13 + Math.random() * 9,
                    seed: idx * 3.3
                });
            });
        }

        function initPalms() {
            [[40, 2.0], [-10, 2.8], [width - 50, 2.2], [width + 20, 3.0]].forEach(([x, s]) =>
                palms.push({ x, s, lean: 0, vel: 0, w: 0, ph: Math.random() * 6.283 }));
        }

        function initCars() {
            // Three lanes each way: the top three run right (white headlights), the bottom three run left (red
            // tail-lights). Lanes beside the median run fastest, the outer lanes slowest. Each car keeps a fixed
            // baseSpeed (its free-flow speed) that congestion and nose-to-tail spacing only ever slow down.
            const laneH = ROAD_H / LANES, perLane = Math.round(26 * CAR_LOOP / (width + 20)); // same on-screen density as before, plus the hidden stretch
            for (let l = 0; l < LANES; l++) {
                const dir = l < LANES / 2 ? 1 : -1;
                const fromMedian = dir > 0 ? LANES / 2 - 1 - l : l - LANES / 2; // 0 = beside the median
                const laneFactor = 1.25 - fromMedian * 0.225;
                for (let k = 0; k < perLane; k++) {
                    const baseSpeed = (Math.random() * 0.6 + 0.6) * laneFactor * dir;
                    const car = {
                        x: ((k + Math.random() * 0.8) / perLane) * CAR_LOOP - CAR_M,
                        y: Math.round(ROAD_Y + l * laneH + laneH / 2 - 0.5),

// ---- Rain ---------------------------------------------------------------------------------------
        // Small, fine drops in three depth layers, drawn along their real velocity. No splashes: a drop simply ends at the ground.

            {

                for (let i = 0; i < PUDDLES.length; i++) { const P = PUDDLES[i], r = P.rx * (0.25 + pk * 1.4); ctx.moveTo(P.x + r, P.y); ctx.ellipse(P.x, P.y, r, P.ry * (0.4 + pk), 0, 0, 6.2832); }
                ctx.fill();
            }
            if (ss(0.05, 0.55, flood) < 0.01) return;
            const g = ctx.createLinearGradient(0, FG_TOP, 0, height);
            g.addColorStop(0, `rgba(${wR + 26}, ${wG + 24}, ${wB + 22}, 0.62)`); g.addColorStop(1, `rgba(${wR + 6}, ${wG + 6}, ${wB + 6}, 0.82)`);
            ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 8) ctx.lineTo(x, fgEdge(x));
            ctx.lineTo(width, height); ctx.closePath(); ctx.fill();
            ctx.save(); ctx.clip(); // slow horizontal ripple bands, only where there is water
            ctx.fillStyle = `rgba(${hR}, ${hG}, ${hB}, ${0.09 + lightningFlash * 0.12})`;
            for (let y = FG_TOP + ((time * 0.04) % 4); y < height; y += 4) ctx.fillRect(0, y | 0, width, 1);
            ctx.restore();
            ctx.strokeStyle = `rgba(${hR}, ${hG}, ${hB}, 0.22)`; ctx.lineWidth = 1; ctx.beginPath();
            for (let x = 0; x <= width; x += 8) x ? ctx.lineTo(x, fgEdge(x)) : ctx.moveTo(x, fgEdge(x));
            ctx.stroke();
            // sky glints sliding over the surface, dragged downwind
            ctx.fillStyle = `rgba(${hR}, ${hG}, ${hB}, ${Math.min(0.6, 0.16 + lightningFlash * 0.3)})`;
            const drift = time * (1 + windSpeed * 0.15);
            for (let i = 0; i < GLINTS.length; i++) {
                const G = GLINTS[i], x = (G.x + drift * G.sp) % width, y = FG_TOP + 3 + G.y * (height - FG_TOP - 4);
                if (y < fgEdge(x) + 2) continue;
                const sn = Math.sin(time * 0.06 + G.ph); if (sn < 0.2) continue;
                ctx.fillRect(x | 0, y | 0, Math.max(1, (G.w * (0.5 + 0.5 * sn)) | 0), 1);
            }
            if (flood > 0.3) { // flotsam drifting on the water: planks, bottles, litter
                ctx.fillStyle = 'rgba(14, 11, 9, 0.75)';
                for (let i = 0; i < FLOTSAM.length; i++) {
                    const F = FLOTSAM[i], x = (F.x + time * F.sp * (0.5 + windSpeed * 0.12)) % width, y = FG_TOP + 4 + F.y * (height - FG_TOP - 8);
                    if (y > fgEdge(x) + 2) ctx.fillRect(x | 0, y | 0, F.w | 0, 1);
                }
            }
            ctx.lineWidth = 1; ctx.strokeStyle = `rgb(${hR}, ${hG}, ${hB})`; // rain rings
            for (let i = 0; i < RINGS.length; i++) {
                const R = RINGS[i]; if (R.age >= R.life) continue;
                const rad = 0.8 + R.age * 0.14; ctx.globalAlpha = (1 - R.age / R.life) * 0.55;
                ctx.beginPath(); ctx.ellipse(R.x, R.y, rad, rad * 0.35, 0, 0, 6.2832); ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }
        function footWater(o) { // water lapping at the foot of a cottage / tree in the flooded lot
            const e = fgEdge(o.x + (o.width ? o.width / 2 : 0));
            if (o.by <= e) return;
            const cvr = Math.min(1, (o.by - e) / 5);
            if (!o.puffs) { // cottage: waterline creeping up the wall + warm window light reflected below
                const d = Math.max(1, Math.round((3 + 11 * ss(0.1, 1, flood)) * o.sc * cvr));
                ctx.fillStyle = `rgba(${wR}, ${wG}, ${wB}, 0.74)`; ctx.fillRect(o.x - 1, o.by - d, o.width + 2, d + 1);
                ctx.fillStyle = `rgba(${hR}, ${hG}, ${hB}, 0.42)`; ctx.fillRect(o.x - 1, o.by - d, o.width + 2, 1);
                const lk = (o.lit && powerOn && nightAmt > o.onThresh) ? litK(o.sl, awakeHome) : 0;
                if (lk > 0.05) { ctx.fillStyle = `rgba(255, 190, 110, ${0.17 * lk})`; ctx.fillRect(o.x + o.width * 0.13, o.by + 1, o.width * 0.6, 2); }
            } else {        // tree: a ripple at the trunk
                const hw = (o.size || 6) * 0.4;
                ctx.fillStyle = `rgba(${wR}, ${wG}, ${wB}, 0.6)`; ctx.fillRect(o.x - hw, o.by - 1, hw * 2, 1);
                ctx.fillStyle = `rgba(${hR}, ${hG}, ${hB}, 0.26)`; ctx.fillRect(o.x - hw, o.by, hw * 2, 1);
            }
        }
        function drawFloodSub() { // water spreading over the suburb plain, behind the houses
            if (subReach() < 0.8) return;
            ctx.fillStyle = `rgba(${wR}, ${wG}, ${wB}, 0.55)`; ctx.beginPath(); ctx.moveTo(0, ROAD_Y);
            for (let x = 0; x <= width; x += 8) ctx.lineTo(x, subEdge(x));
            ctx.lineTo(width, ROAD_Y); ctx.closePath(); ctx.fill();
            ctx.fillStyle = `rgba(${hR}, ${hG}, ${hB}, ${Math.min(0.5, 0.14 + lightningFlash * 0.3)})`;
            for (let i = 0; i < 40; i++) {
                const G = GLINTS[i], x = (G.x + time * (1 + windSpeed * 0.15) * G.sp) % width, e = subEdge(x), y = e + 2 + G.y * (ROAD_Y - e - 3);
                const sn = Math.sin(time * 0.06 + G.ph); if (sn > 0.2 && y < ROAD_Y - 1) ctx.fillRect(x | 0, y | 0, Math.max(1, (G.w * 0.6 * (0.5 + 0.5 * sn)) | 0), 1);
            }
        }
        function wetFoot(x, w, by, dep) { // water up the walls of the houses on the plain
            if (by <= subEdge(x + w / 2)) return;
            const d = Math.max(1, Math.round(dep));
            ctx.fillStyle = `rgba(${wR}, ${wG}, ${wB}, 0.62)`; ctx.fillRect(x, by - d, w, d + 1);
            ctx.fillStyle = `rgba(${hR}, ${hG}, ${hB}, 0.28)`; ctx.fillRect(x, by - d, w, 1);
        }
        function drawRoadWater() { // over the road: brown tint, reflected headlights, hazard lights on stalled cars
            const rc = ss(0.28, 0.75, flood), sh = Math.max(rc, wet * 0.55);
            if (sh < 0.03) return;
            if (rc > 0.02) { ctx.fillStyle = `rgba(${wR}, ${wG}, ${wB}, ${0.34 * rc})`; ctx.fillRect(0, ROAD_Y, width, ROAD_H); }
            for (let pass = 0; pass < 2; pass++) {
                const list = pass ? carsL : carsR;
                ctx.fillStyle = pass ? '#f00' : '#fff'; ctx.globalAlpha = 0.16 * sh;
                for (let i = 0; i < list.length; i++) { const c = list[i]; if (c.active) ctx.fillRect(c.x, c.y + 1, c.width, 2); }
            }
            ctx.globalAlpha = 1;
            if (flood > 0.7) {
                for (let i = 0; i < cars.length; i++) {
                    const c = cars[i];
                    if (c.stall && ((time * 0.05 + c.x * 0.1) % 2) < 1) {
                        ctx.fillStyle = 'rgba(255, 170, 40, 0.95)'; ctx.fillRect(c.x, c.y, c.width, 1);
                        ctx.fillStyle = 'rgba(255, 170, 40, 0.22)'; ctx.fillRect(c.x - 1, c.y - 1, c.width + 2, 3);
                    }
                }
            }
        }

        function drawSuburbs() {
            drawFloodSub();
            // houses and trees share one depth-sorted list, so a tree can stand in front of one house and behind another
            suburbDraw.forEach(o => o.puffs ? drawTree(o) : drawHouse(o));
        }

        function drawHighway() {
            const laneH = ROAD_H / LANES, mid = ROAD_Y + ROAD_H / 2;
            if (!roadC) { // static road paint: rendered once, then blitted
                roadC = mkCanvas(); const sv = ctx; ctx = roadC.getContext('2d');
            ctx.fillStyle = '#080a0f';
            ctx.fillRect(0, ROAD_Y, width, ROAD_H);

            // solid edge lines, dashed lane dividers, and a double line down the median
            ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
            ctx.fillRect(0, ROAD_Y, width, 1);
            ctx.fillRect(0, ROAD_Y + ROAD_H - 1, width, 1);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.11)';
            ctx.lineWidth = 1;
            ctx.setLineDash([7, 7]);
            ctx.beginPath();
            for (let l = 1; l < LANES; l++) {
                if (l === LANES / 2) continue;
                const y = Math.round(ROAD_Y + l * laneH) + 0.5;
                ctx.moveTo(0, y); ctx.lineTo(width, y);
            }
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(255, 200, 90, 0.22)';
            ctx.fillRect(0, mid - 1.5, width, 1);
            ctx.fillRect(0, mid + 0.5, width, 1);

                ctx = sv;
            }
            ctx.drawImage(roadC, 0, ROAD_Y, width, ROAD_H, 0, ROAD_Y, width, ROAD_H);

            // each car is a light streak with a soft halo (no shadowBlur: far cheaper with ~150 cars on the road)
            for (let pass = 0; pass < 2; pass++) {
                const list = pass ? carsL : carsR;
                ctx.fillStyle = pass ? '#f00' : '#fff';
                ctx.globalAlpha = 0.22;
                for (let i = 0; i < list.length; i++) { const c = list[i]; if (c.active) ctx.fillRect(c.x - 1, c.y - 1, c.width + 2, 3); }
                ctx.globalAlpha = 1;
                for (let i = 0; i < list.length; i++) { const c = list[i]; if (c.active) ctx.fillRect(c.x, c.y, c.width, 1); }
            }

            drawRoadWater();

            ctx.fillStyle = `rgba(5, 7, 10, ${0.8 + weatherTransition * 0.2})`;
            ctx.fillRect(0, ROAD_Y + ROAD_H, width, height - (ROAD_Y + ROAD_H));
        }

        function drawForeground() {
            // Street lamp (tall, with arm + housing) and garden lamp (short bollard),
            // both tied to the citywide power state so they go dark in the blackout
            function drawLamp(x, y, type, seed) {
                let onThresh = lampOnThresh[seed] !== undefined ? lampOnThresh[seed] : 0.12;
                let lampReady = powerOn && (nightAmt > onThresh || karhutla > 0.75); // street lights come on in the midday gloom
                let flicker = lampReady ? (0.85 + Math.sin(time * 3 + seed) * 0.15) : 0;
                if (flicker > 0) {
                    // Pool of warm light where the lamp meets the ground
                    drawGlow(x, y, type === 'street' ? 26 : 14, 0.22 * flicker, '255, 200, 130', 0.35);
                }
                ctx.fillStyle = '#020203';
                if (type === 'street') {
                    ctx.fillRect(x - 1, y - 34, 2, 34);
                    ctx.fillRect(x - 1, y - 34, 8, 2);
                    ctx.fillRect(x + 5, y - 37, 5, 4);
                    if (flicker > 0) {
                        drawGlow(x + 7, y - 35, 15, 0.55 * flicker, '255, 205, 130');
                        ctx.fillStyle = `rgba(255, 225, 170, ${flicker})`;
                        ctx.fillRect(x + 6, y - 36, 3, 2);
                    }
                } else {
                    ctx.fillRect(x - 1, y - 12, 2, 12);
                    ctx.beginPath();
                    ctx.ellipse(x, y - 14, 4, 2.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    if (flicker > 0) {
                        drawGlow(x, y - 13, 9, 0.5 * flicker, '255, 205, 130');
                        ctx.fillStyle = `rgba(255, 230, 180, ${flicker})`;
                        ctx.beginPath(); ctx.arc(x, y - 14, 1.5, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }

            // Cozy little cottages sitting still in the foreground lot, warmly lit at night, each with a tiny
            // fence or garden lantern — unaffected by wind since they're buildings.
            function drawCottage(hm) {
                const baseY = hm.by, hy = baseY - hm.height, sc = hm.sc;
                const litBase = hm.lit && powerOn && nightAmt > hm.onThresh;
                const lk = litBase ? litK(hm.sl, awakeHome) : 0, lightsOn = lk > 0.01;
                const lanK = litBase ? litK(hm.sl, awakeHome + 0.35) : 0; // porch lantern is often left on all night

                ctx.fillStyle = hm.wallColor;
                ctx.fillRect(hm.x, hy, hm.width, hm.height);

                ctx.beginPath();
                ctx.moveTo(hm.x - 2 * sc, hy);
                ctx.lineTo(hm.x + hm.width / 2, hy - hm.roofH);
                ctx.lineTo(hm.x + hm.width + 2 * sc, hy);
                ctx.closePath();
                ctx.fillStyle = hm.roofColor;
                ctx.fill();
                ctx.fillRect(hm.x + hm.width * 0.72, hy - hm.roofH * 0.75, 2.5 * sc, hm.roofH * 0.75); // chimney

                ctx.fillStyle = '#050506';
                ctx.fillRect(hm.x + hm.width * 0.4, hy + hm.height * 0.42, hm.width * 0.18, hm.height * 0.58); // door

                const wx1 = hm.x + hm.width * 0.13, wx2 = hm.x + hm.width * 0.67;
                const wy = hy + hm.height * 0.22, ww = hm.width * 0.2, wh = hm.height * 0.26;
                if (lightsOn) {
                    ctx.fillStyle = `rgba(255, 190, 110, ${0.22 * lk})`; // soft halo
                    ctx.fillRect(wx1 - 1, wy - 1, ww + 2, wh + 2);
                    ctx.fillRect(wx2 - 1, wy - 1, ww + 2, wh + 2);
                }
                ctx.fillStyle = 'rgba(35, 45, 60, 0.55)';
                ctx.fillRect(wx1, wy, ww, wh);
                ctx.fillRect(wx2, wy, ww, wh);
                if (lightsOn) {
                    ctx.fillStyle = `rgba(255, 200, 125, ${0.95 * lk})`;
                    ctx.fillRect(wx1, wy, ww, wh);
                    ctx.fillRect(wx2, wy, ww, wh);
                }

                if (hm.hasFence) {
                    ctx.strokeStyle = 'rgba(12, 12, 15, 0.85)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for(let fx = hm.x - 9 * sc; fx < hm.x - 1; fx += 3) {
                        ctx.moveTo(fx, baseY);
                        ctx.lineTo(fx, baseY - 4 * sc);
                    }
                    ctx.stroke();
                }

                if (hm.hasLantern && lanK > 0.01) {
                    let lx = hm.x + hm.width + 6 * sc, ly = baseY - 5 * sc;
                    drawGlow(lx, ly, 8, 0.5 * lanK, '255, 205, 130');
                    ctx.fillStyle = '#020203';
                    ctx.fillRect(lx - 0.5, ly, 1, 5 * sc);
                    ctx.fillStyle = `rgba(255, 225, 170, ${0.9 * lanK})`;
                    ctx.beginPath(); ctx.arc(lx, ly, 1.2, 0, Math.PI * 2); ctx.fill();
                }
            }

            function drawSmallHills() {
                let baseY = height;
                smallHills.forEach(hl => {
                    ctx.fillStyle = '#05080a';
                    ctx.beginPath();
                    ctx.ellipse(hl.x + hl.width / 2, baseY, hl.width / 2, hl.height, 0, Math.PI, 2 * Math.PI, false);
                    ctx.closePath();
                    ctx.fill();
                });
            }

            // Foreground palm. Its trunk bows with a spring-driven lean; fronds bend downwind (saturating, so a gale
            // streams them out rather than spinning them round) and the tip of each frond whips later than its base.
            function drawPalmTree(p) {
                ctx.lineCap = 'round';
                const scale = p.s, w = p.w;
                let cx = p.x, cy = height + 20;
                const segments = 8, segLen = 15 * scale;

                // Trunk: build points first so we can taper width + add a rim-light pass
                let pts = [{x: cx, y: cy}];
                let currentAngle = 0;
                for(let i=0; i<segments; i++) {
                    currentAngle += p.lean * (i / segments) * 0.6; // bends most toward the crown
                    cx += Math.sin(currentAngle) * segLen;
                    cy -= Math.cos(currentAngle) * segLen;
                    pts.push({x: cx, y: cy});
                }
                for(let i=0; i<pts.length-1; i++) {
                    let tw = (1 - i/pts.length) * 4.5 * scale + 1;
                    ctx.strokeStyle = '#020203';
                    ctx.lineWidth = tw;
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x, pts[i].y);
                    ctx.lineTo(pts[i+1].x, pts[i+1].y);
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(55, 65, 80, 0.3)';
                    ctx.lineWidth = Math.max(1, tw * 0.3);
                    ctx.beginPath();
                    ctx.moveTo(pts[i].x - 1, pts[i].y);
                    ctx.lineTo(pts[i+1].x - 1, pts[i+1].y);
                    ctx.stroke();
                }

                const push = Math.tanh(w * 0.05) * 1.9;  // how far the wind has swept the fronds downwind
                const flap = Math.min(1, w * 0.04);      // how hard they thrash
                const streak = Math.tanh(w * 0.05) * 0.22; // leaflets fold back along the wind
                const leafletFlutter = Math.min(w, 30) * 0.012 + weatherTransition * 0.03;

                function drawFrond(baseAngle, frondLen, droop, seed) {
                    const stiff = droop ? 0.45 : 1; // heavy drooping fronds resist the wind more
                    // the tip flexes further, and a beat later, than the base, so the bend travels down the frond
                    const aMid = baseAngle + push * stiff * 0.8 + Math.sin(p.ph + seed) * 0.05 * flap;
                    const aTip = baseAngle + push * stiff + Math.sin(p.ph * 1.3 + seed - 0.9) * 0.16 * flap + Math.sin(p.ph * 2.9 + seed * 2) * 0.05 * flap;

                    // Real coconut fronds arch up from the crown, then sag under their own weight toward the tip
                    let archAmt = (droop ? 0.6 : 0.34) * frondLen;
                    let fx = cx + Math.cos(aTip) * frondLen;
                    let fy = cy + Math.sin(aTip) * frondLen + Math.tanh(w * 0.05) * scale * 6 + archAmt * 0.4;
                    let midX = cx + Math.cos(aMid) * frondLen * 0.45;
                    let midY = cy + Math.sin(aMid) * frondLen * 0.18 - archAmt * 0.3;

                    // Rachis (central stem), with a faint cool rim-light along one edge for depth
                    ctx.strokeStyle = '#020203';
                    ctx.lineWidth = 1.6 * scale;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.quadraticCurveTo(midX, midY, fx, fy);
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(45, 80, 65, 0.3)';
                    ctx.lineWidth = Math.max(0.6, 0.4 * scale);
                    ctx.beginPath();
                    ctx.moveTo(cx - 0.6, cy);
                    ctx.quadraticCurveTo(midX - 0.6, midY, fx - 0.6, fy);
                    ctx.stroke();

                    // Feathered leaflets angled forward along the curve, longest at mid-frond and tapering toward
                    // both ends, each fluttering on the shared phase (smooth, not per-frame noise)
                    const dark = new Path2D(), glint = dayAmt > 0.1 ? new Path2D() : null;
                    for(let t = 0.1; t <= 0.97; t += 0.065) {
                        let px = (1-t)*(1-t)*cx + 2*(1-t)*t*midX + t*t*fx;
                        let py = (1-t)*(1-t)*cy + 2*(1-t)*t*midY + t*t*fy;
                        let tanX = 2*(1-t)*(midX-cx) + 2*t*(fx-midX);
                        let tanY = 2*(1-t)*(midY-cy) + 2*t*(fy-midY);
                        let tangentAngle = Math.atan2(tanY, tanX);
                        let lenProfile = Math.sin(Math.PI * Math.pow(t, 0.8));
                        let leafletLen = (0.35 + lenProfile * 0.95) * 5.5 * scale;
                        let forwardSweep = 1.15 - t * 0.4; // leaflets angle more forward near the tip
                        let jitter = Math.sin(p.ph * 1.9 + seed * 3 + t * 10) * leafletFlutter + streak;

                        const ca = Math.cos(tangentAngle + forwardSweep + jitter), sa = Math.sin(tangentAngle + forwardSweep + jitter);
                        dark.moveTo(px, py); dark.lineTo(px + ca * leafletLen, py + sa * leafletLen);
                        dark.moveTo(px, py);
                        dark.lineTo(px - Math.cos(tangentAngle - forwardSweep - jitter) * leafletLen * 0.9,
                                    py - Math.sin(tangentAngle - forwardSweep - jitter) * leafletLen * 0.9);
                        if (glint) { glint.moveTo(px, py); glint.lineTo(px + ca * leafletLen * 0.7, py + sa * leafletLen * 0.7); } // sunlit glint
                    }
                    ctx.lineWidth = 0.9;
                    ctx.strokeStyle = '#020203';
                    ctx.stroke(dark);
                    if (glint) { ctx.strokeStyle = `rgba(60, 110, 75, ${dayAmt * 0.28})`; ctx.stroke(glint); }
                }

                let numFronds = 7;
                for(let i=0; i<numFronds; i++) {
                    let baseFrondAngle = (-Math.PI/2) + ((i - (numFronds-1)/2) * 0.6);
                    drawFrond(baseFrondAngle, 26 * scale, false, i);
                }
                // Older, heavier fronds sagging below the crown for a fuller silhouette
                let numDroop = 4;
                for(let i=0; i<numDroop; i++) {
                    let baseFrondAngle = 0.35 + (i - (numDroop-1)/2) * 0.5;
                    drawFrond(baseFrondAngle, 20 * scale, true, i + 10);
                }

                // Coconuts
                ctx.fillStyle = '#020203';
                ctx.beginPath();
                ctx.arc(cx - 3*scale, cy + 3*scale, 2.5*scale, 0, Math.PI*2);
                ctx.arc(cx + 3*scale, cy + 2*scale, 2.5*scale, 0, Math.PI*2);
                ctx.fill();
            }

            // Draw Tropical Foliage / Broad leaves framing the bottom corners
            function drawBroadLeaf(lx, ly, scale, angle, seed) {
                let lw = windAt(lx); // leans downwind with the local gust, then flutters on top of that
                let leafSway = Math.tanh(lw * 0.04) * 0.3 + Math.sin(windPhase * 1.6 + seed) * Math.min(0.22, lw * 0.008);
                { const a = angle + leafSway, cs = Math.cos(a), sn = Math.sin(a); ctx.setTransform(cs, sn, -sn, cs, lx, ly); }
                ctx.fillStyle = '#010102';
                ctx.beginPath();
                ctx.ellipse(0, -15 * scale, 8 * scale, 20 * scale, 0, 0, Math.PI * 2);
                ctx.fill();
                // central vein + a couple of side ribs for texture
                ctx.strokeStyle = 'rgba(45, 55, 50, 0.35)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, 4 * scale);
                ctx.lineTo(0, -34 * scale);
                ctx.moveTo(0, -6 * scale); ctx.lineTo(4 * scale, -18 * scale);
                ctx.moveTo(0, -14 * scale); ctx.lineTo(-4 * scale, -26 * scale);
                ctx.stroke();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }

            broadLeaves.forEach(leaf => drawBroadLeaf(leaf.x, height + 10, leaf.scale, leaf.angle, leaf.seed));

            // Rolling hills filling the empty land before the road, then the suburban row on top
            drawSmallHills();
            drawFloodGround(); // puddles / flood sheet lie on the ground, behind everything standing on it
            const flooded = flood > 0.05;
            fgDraw.forEach(o => { if (o.puffs) drawTree(o); else drawCottage(o); if (flooded) footWater(o); }); // cottages + trees, far to near

            palms.forEach(drawPalmTree);

            // Street lamps and garden lamps near the trees — dark during the blackout
            drawLamp(70, height, 'street', 1);
            drawLamp(width - 95, height, 'street', 2);
            drawLamp(14, height, 'garden', 3);
            drawLamp(width - 14, height, 'garden', 4);
            drawLamp(width * 0.5 - 28, height, 'garden', 5);
            drawLamp(50, height, 'garden', 6);
            drawLamp(95, height, 'street', 7);

                // jendela rumah depan: halo hangat lebar yang meluber ke dinding, atap, dan tanah
                for (let i = 0; i < foregroundHomes.length; i++) {
                    const hm = foregroundHomes[i];
                    const lk = (hm.lit && nightAmt > hm.onThresh) ? litK(hm.sl, awakeHome) : 0;
                    if (lk < 0.02) continue;
                    const hy = hm.by - hm.height, wy = hy + hm.height * 0.35;
                    drawGlow(hm.x + hm.width * 0.25, wy, 14 * hm.sc + 8, 0.17 * lk * pw, WARM, 0.85);
                    drawGlow(hm.x + hm.width * 0.77, wy, 14 * hm.sc + 8, 0.17 * lk * pw, WARM, 0.85);
                    drawGlow(hm.x + hm.width / 2, hm.by + 1, hm.width * 1.1 + 10, 0.11 * lk * pw, WARM2, 0.3);
                }
                // lampu jalan / lampu taman
                for (const [x, t, seed] of LAMPS) {
                    const k = lampK(seed) * pw; if (k < 0.01) continue;
                    const y = height;
                    if (isStreet(t)) {
                        const hx = x + 7, hyy = y - 35;
                        // kerucut cahaya ke bawah
                        const g = ctx.createLinearGradient(hx, hyy, hx, y);
                        g.addColorStop(0, `rgba(255,200,130,${0.2 * k})`); g.addColorStop(1, 'rgba(255,190,110,0.03)');
                        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(hx - 2, hyy + 2); ctx.lineTo(hx + 2, hyy + 2); ctx.lineTo(hx + 34, y); ctx.lineTo(hx - 34, y); ctx.closePath(); ctx.fill();
                        drawGlow(hx, hyy, 62, 0.16 * k, WARM, 0.85);   // pendar besar yang menyebar ke rumah sekitar
                        drawGlow(hx, hyy + 6, 108, 0.08 * k, WARM2, 0.7); // lapisan lebar sangat lembut
                        drawGlow(hx, hyy, 22, 0.3 * k, '255, 225, 170');   // inti terang
                        drawGlow(hx, y - 3, 60, 0.2 * k, WARM2, 0.22);      // genangan cahaya di tanah
                    } else {
                        const hx = x, hyy = y - 14;
                        drawGlow(hx, hyy, 30, 0.14 * k, WARM, 0.85);
                        drawGlow(hx, hyy, 50, 0.06 * k, WARM2, 0.7);
                        drawGlow(hx, y - 2, 28, 0.14 * k, WARM2, 0.25);
                    }
                }
                ctx.globalCompositeOperation = 'source-over';
            }
            return { suburbs_, foreground_ };
        })();

        // ---- Frame pacing ---------------------------------------------------------------------------
        // rAF timestamps jitter by a millisecond or two, which shows up as micro-stutter in anything moving. dt is therefore the
        // median of the last 9 frame gaps, snapped to the nearest real refresh period (144/120/90/72/60/30 Hz); a genuinely
        // dropped frame (gap > 1.6x) is passed through so the simulation still catches up.
        const dtRing = new Float32Array(9), dtTmp = new Float32Array(9); let dtN = 0, refreshMs = 16.667, frameMs = 4, govTick = 0, sortTick = 0, roadC = null;
        const REFRESH = [6.944, 8.333, 11.111, 13.889, 16.667, 33.333];
        function frameDelta(raw) {
            dtRing[dtN++ % 9] = raw; dtTmp.set(dtRing); dtTmp.sort();
            const med = dtTmp[4] || raw; let snap = med;
            for (let i = 0; i < 6; i++) if (Math.abs(med - REFRESH[i]) < REFRESH[i] * 0.12) { snap = REFRESH[i]; break; }
            refreshMs = snap;
            return raw > snap * 1.6 ? raw : snap;
        }
        // Governor: the wind-driven layers (trees, cottages, palms) are redrawn EVERY frame whenever the measured frame cost leaves
        // headroom (=> true 120 Hz motion); only if the budget (70% of the refresh period) would be exceeded are they redrawn every
        // 2nd-4th frame, staggered, and in dead calm (sub-pixel sway) every 3rd frame to save power.
        function govern() {
            const need = layerSub.cost + layerFg.cost, per = layerSub.cost / layerSub.k + layerFg.cost / layerFg.k;
            const spare = refreshMs * 0.7 - Math.max(0.3, frameMs - per);
            let k = need <= spare ? 1 : Math.min(4, Math.ceil(need / Math.max(0.4, spare)));
            if (windSpeed < 0.6) k = Math.max(k, 3);
            layerSub.k = layerFg.k = k;
        }

        let lastT = 0;
        function gameLoop(now) {
            requestAnimationFrame(gameLoop); // schedule first: the next frame is queued while this one is being built
            const t0 = performance.now();
            dt = lastT ? Math.min(3, Math.max(0.05, frameDelta(now - lastT) / 16.6667)) : 1;
            lastT = now;
            updatePhysics();
            V15.updatePlanes();

            drawSkyAndHills();
            drawLightningBolt();
            drawGatherClouds();
            V15.drawPlanes();
            drawCity();
            V15.drawCityAmbience();
            drawCityClouds();
            drawBackLights();
            drawShadows(0);
            drawCached(layerSub, drawSuburbs);
            NightSpill.suburbs_();
            drawSmogBack();
            drawHighway();
            drawWeather();
            drawShadows(1);
            drawCached(layerFg, drawForeground);
            NightSpill.foreground_();
            drawDriftLeaves();
            drawRainFront();
            drawAmbientLight();

            frameMs += (performance.now() - t0 - frameMs) * 0.1;
            if ((govTick++ % 15) === 0) govern();
        }
        window.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'k') seasonKey(1); else if (k === 'h') seasonKey(0); else if (k === 'b') toggleBigStorm(); else if (k === 'g') triggerQuake(); else if (k === 'f') toggleKarhutla(); });
        document.addEventListener('visibilitychange', () => { lastT = 0; dtN = 0; dtRing.fill(0); });

        // Initialize and start
        initStars();
        initClouds();
        initGatherClouds();
        initCity();
        initBackLights();
        initBroadLeaves();
        initSuburbs();
        initForegroundHomes();
        initForegroundTrees();
        initRoadsideForest();
        initSmallHills();
        initPalms();
        allTrees = suburbTrees.concat(foregroundTrees);
        initCars();
        initRain();
        prepareStatic();
        V15.init();
        V15.seed();

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
